name: Package and release toolbox

# Tag a commit `vX.Y.Z` and push the tag to trigger this. It builds the
# .mltbx with packaging/build_toolbox.m and attaches it to a GitHub
# Release for that tag. If the File Exchange submission is linked to
# this GitHub repo, MathWorks picks up new Releases automatically --
# see the "Releasing" section in README.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # manual "Run workflow" button -- sidesteps tag-push
                        # trigger flakiness/propagation delay when needed
    inputs:
      tag_name:
        description: 'Release tag to publish under (default: v<VERSION>)'
        required: false
        default: ''

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the Release and upload the .mltbx asset
    steps:
      - uses: actions/checkout@v4

      - name: Check VERSION matches the tag
        if: github.event_name == 'push'   # no tag ref to check on a manual dispatch
        run: |
          tag="${GITHUB_REF_NAME#v}"
          have="$(cat VERSION | tr -d '[:space:]')"
          if [ "$tag" != "$have" ]; then
            echo "::error::Tag v$tag does not match VERSION file ($have). Update VERSION and re-tag."
            exit 1
          fi

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      - name: Build .mltbx
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('packaging'); build_toolbox();

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            tag="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(cat VERSION | tr -d '[:space:]')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: packaging/dist/*.mltbx
          generate_release_notes: true
